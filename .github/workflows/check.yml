name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safe checks
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build.sh
      - name: Check app bundle
        run: ./scripts/check-release.sh
