name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safe checks
        run: ./scripts/test.sh
      - name: Package and verify development candidate
        run: ./scripts/package.sh
      - name: Retain tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-candidate-${{ github.sha }}
          path: |
            dist/Keep Awake.zip
            dist/Keep Awake.dmg
          if-no-files-found: error
          retention-days: 14
